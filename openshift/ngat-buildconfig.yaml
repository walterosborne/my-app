apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ngat
  labels:
    app: ngat
spec:
  source:
    type: Git
    git:
      uri: https://github.com/walterosborne/my-app.git
      ref: kubernetes
    contextDir: /
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: docker-ng-staging.northgrum.com/wosborne/ngat:latest
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  triggers:
    - type: ConfigChange
  runPolicy: Serial
