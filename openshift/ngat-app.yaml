apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngat
  labels: { app: ngat }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ngat }
  template:
    metadata:
      labels: { app: ngat }
    spec:
      containers:
        - name: ngat
          image: docker-ng-staging.northgrum.com/wosborne/ngat:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: audit }
            - secretRef: { name: roster }
            - secretRef: { name: entra }
            - secretRef: { name: smtp }
          env:
            - { name: NODE_ENV, value: production }
            - { name: NGAT_ENV, value: production }
            - { name: PORT, value: "8080" }
            - { name: ALLOW_HARDCODED_IDENTITY_FALLBACK, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: ngat-internal
spec:
  type: ClusterIP
  selector: { app: ngat }
  ports:
    - { name: http, port: 8080, targetPort: http }
